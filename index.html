html,

    margin: 0;

/* =========================================
   MAIN CONTAINER
========================================= */

.container {
    position: relative;

    width: 360px;
    height: 500px;

    justify-content: center;

/* =========================================
   GIFT
========================================= */

.gift {
    position: absolute;

    width: 125px;
    height: 120px;

    bottom: 95px;

    cursor: pointer;

    z-index: 5;

    animation: wiggle 2s infinite steps(2);
}


.box {
    position: absolute;

    width: 125px;
    height: 85px;

    left: 0;
    bottom: 0;

    background: #ff5c9a;

    border: 5px solid #ff9fc2;
}


.box::before {
    content: "";

    position: absolute;

    width: 18px;
    height: 80px;

    left: 48px;
    top: 0;

    background: #ffd166;
}


.box::after {
    content: "";

    position: absolute;

    width: 115px;
    height: 18px;

    left: 0;
    top: 30px;

    background: #ffd166;
}


/* =========================================
   LID
========================================= */

.lid {
    position: absolute;

    width: 135px;
    height: 32px;

    left: -5px;
    top: 10px;

    background: #ff72aa;

    border: 5px solid #ffb0ce;

    z-index: 3;

    transform-origin: left bottom;

    transition:
        transform 0.7s steps(8);
}


.lid::after {
    content: "";

    position: absolute;

    width: 18px;
    height: 27px;

    left: 54px;
    top: 0;

    background: #ffd166;
}


/* =========================================
   BOW
========================================= */

.bow-left,
.bow-right {
    position: absolute;

    width: 30px;
    height: 25px;

    top: -12px;

    background: #ffd166;

    border: 4px solid #fff0a6;

    z-index: 4;

    transition:
        transform 0.7s steps(8);
}


.bow-left {
    left: 30px;
    transform: rotate(-20deg);
}


.bow-right {
    right: 30px;
    transform: rotate(20deg);
}


/* =========================================
   OPEN GIFT
========================================= */

.gift.open .lid {
    transform:
        translate(-4px, -42px)
        rotate(-5deg);
}


.gift.open .bow-left {
    transform:
        translate(-12px, -18px)
        rotate(-35deg);
}


.gift.open .bow-right {
    transform:
        translate(12px, -18px)
        rotate(35deg);
}


/* =========================================
   GIFT WIGGLE
========================================= */

@keyframes wiggle {

    0% {
        transform: rotate(0deg);
    }

    25% {
        transform: rotate(-2deg);
    }

    50% {
        transform: rotate(2deg);
    }

    75% {
        transform: rotate(-1deg);

    100% {
        transform: rotate(0deg);

}

.flower::before {

    width: 8px;
    height: 8px;

    left: 5px;
    top: 5px;

    box-shadow:

        7px 0 currentColor,
        0 -7px currentColor,

}


/* เกสร */

.flower::after {
