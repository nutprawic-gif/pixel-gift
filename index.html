<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>For You ♡</title>

<style>

/* =========================================
   BASIC
========================================= */

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
}

body {
    background: #000;
    overflow: hidden;

    display: flex;
    justify-content: center;
    align-items: center;

    font-family: "Courier New", monospace;
}


/* =========================================
   MAIN CONTAINER
========================================= */

.container {
    position: relative;

    width: 360px;
    height: 500px;

    display: flex;
    justify-content: center;
    align-items: center;
}


/* =========================================
   GIFT
========================================= */

.gift {
    position: absolute;

    width: 160px;
    height: 150px;

    bottom: 95px;

    cursor: pointer;

    z-index: 5;

    animation: wiggle 2s infinite steps(2);
}


/* =========================================
   BOX
========================================= */

.box {
    position: absolute;

    width: 160px;
    height: 105px;

    left: 0;
    bottom: 0;

    background: #ff5c9a;

    border: 6px solid #ff9fc2;
}


/* vertical ribbon */

.box::before {
    content: "";

    position: absolute;

    width: 22px;
    height: 99px;

    left: 63px;
    top: 0;

    background: #ffd166;
}


/* horizontal ribbon */

.box::after {
    content: "";

    position: absolute;

    width: 148px;
    height: 22px;

    left: 0;
    top: 35px;

    background: #ffd166;
}


/* =========================================
   LID
========================================= */

.lid {
    position: absolute;

    width: 170px;
    height: 38px;

    left: -5px;
    top: 12px;

    background: #ff72aa;

    border: 6px solid #ffb0ce;

    z-index: 3;

    transform-origin: left bottom;

    transition:
        transform 0.7s steps(8);
}


/* lid ribbon */

.lid::after {
    content: "";

    position: absolute;

    width: 22px;
    height: 32px;

    left: 68px;
    top: 0;

    background: #ffd166;
}


/* =========================================
   BOW
========================================= */

.bow-left,
.bow-right {
    position: absolute;

    width: 38px;
    height: 30px;

    top: -15px;

    background: #ffd166;

    border: 5px solid #fff0a6;

    z-index: 4;

    transition:
        transform 0.7s steps(8);
}

.bow-left {
    left: 39px;

    transform: rotate(-20deg);
}

.bow-right {
    right: 39px;

    transform: rotate(20deg);
}


/* =========================================
   OPEN ANIMATION
========================================= */

.gift.open .lid {
    transform:
        translate(-5px, -55px)
        rotate(-5deg);
}

.gift.open .bow-left {
    transform:
        translate(-18px, -25px)
        rotate(-35deg);
}

.gift.open .bow-right {
    transform:
        translate(18px, -25px)
        rotate(35deg);
}


/* =========================================
   WIGGLE
========================================= */

@keyframes wiggle {

    0% {
        transform: rotate(0deg);
    }

    25% {
        transform: rotate(-2deg);
    }

    50% {
        transform: rotate(2deg);
    }

    75% {
        transform: rotate(-1deg);
    }

    100% {
        transform: rotate(0deg);
    }

}


/* =========================================
   FLOWERS AREA
========================================= */

.flowers {
    position: absolute;

    width: 360px;
    height: 300px;

    left: 0;
    bottom: 180px;

    pointer-events: none;

    z-index: 4;
}


/* =========================================
   FLOWER
========================================= */

.flower {
    position: absolute;

    left: 50%;
    top: 50%;

    width: 22px;
    height: 22px;

    opacity: 0;

    transform: translate(-50%, -50%);

    image-rendering: pixelated;
}


/* petals */

.flower::before {
    content: "";

    position: absolute;

    width: 10px;
    height: 10px;

    left: 6px;
    top: 6px;

    background: currentColor;

    box-shadow:
        -8px 0 currentColor,
        8px 0 currentColor,
        0 -8px currentColor,
        0 8px currentColor;
}


/* flower center */

.flower::after {
    content: "";

    position: absolute;

    width: 7px;
    height: 7px;

    left: 8px;
    top: 8px;

    background: #ffd166;
}


/* =========================================
   FLOWER COLORS
========================================= */

.flower1 {
    color: #ff6fae;
}

.flower2 {
    color: #ffd84d;
}

.flower3 {
    color: #b58cff;
}

.flower4 {
    color: #ffffff;
}

.flower5 {
    color: #ff8fc7;
}

.flower6 {
    color: #ffe36e;
}

.flower7 {
    color: #c39bff;
}

.flower8 {
    color: #7fdcff;
}


/* =========================================
   FLOWER BURST
========================================= */

.gift.open ~ .flowers .flower {
    animation-duration: 1.4s;

    animation-fill-mode: forwards;

    animation-timing-function: steps(10);
}


/* flower 1 */

.gift.open ~ .flowers .flower1 {
    animation-name: flower1;
    animation-delay: 0s;
}


/* flower 2 */

.gift.open ~ .flowers .flower2 {
    animation-name: flower2;
    animation-delay: 0.05s;
}


/* flower 3 */

.gift.open ~ .flowers .flower3 {
    animation-name: flower3;
    animation-delay: 0.1s;
}


/* flower 4 */

.gift.open ~ .flowers .flower4 {
    animation-name: flower4;
    animation-delay: 0.15s;
}


/* flower 5 */

.gift.open ~ .flowers .flower5 {
    animation-name: flower5;
    animation-delay: 0.2s;
}


/* flower 6 */

.gift.open ~ .flowers .flower6 {
    animation-name: flower6;
    animation-delay: 0.25s;
}


/* flower 7 */

.gift.open ~ .flowers .flower7 {
    animation-name: flower7;
    animation-delay: 0.3s;
}


/* flower 8 */

.gift.open ~ .flowers .flower8 {
    animation-name: flower8;
    animation-delay: 0.35s;
}


/* =========================================
   FLOWER DIRECTIONS
========================================= */

@keyframes flower1 {

    0% {
        opacity: 0;
        transform: translate(-50%, -50%);
    }

    20% {
        opacity: 1;
    }

    100% {
        opacity: 1;
        transform:
            translate(-190px, -125px)
            rotate(180deg);
    }
}


@keyframes flower2 {

    0% {
        opacity: 0;
        transform: translate(-50%, -50%);
    }

    20% {
        opacity: 1;
    }

    100% {
        opacity: 1;
        transform:
            translate(-110px, -160px)
            rotate(-180deg);
    }
}


@keyframes flower3 {

    0% {
        opacity: 0;
        transform: translate(-50%, -50%);
    }

    20% {
        opacity: 1;
    }

    100% {
        opacity: 1;
        transform:
            translate(-15px, -175px)
            rotate(180deg);
    }
}


@keyframes flower4 {

    0% {
        opacity: 0;
        transform: translate(-50%, -50%);
    }

    20% {
        opacity: 1;
    }

    100% {
        opacity: 1;
        transform:
            translate(90px, -150px)
            rotate(-180deg);
    }
}


@keyframes flower5 {

    0% {
        opacity: 0;
        transform: translate(-50%, -50%);
    }

    20% {
        opacity: 1;
    }

    100% {
        opacity: 1;
        transform:
            translate(150px, -100px)
            rotate(180deg);
    }
}


@keyframes flower6 {

    0% {
        opacity: 0;
        transform: translate(-50%, -50%);
    }

    20% {
        opacity: 1;
    }

    100% {
        opacity: 1;
        transform:
            translate(135px, -30px)
            rotate(-180deg);
    }
}


@keyframes flower7 {

    0% {
        opacity: 0;
        transform: translate(-50%, -50%);
    }

    20% {
        opacity: 1;
    }

    100% {
        opacity: 1;
        transform:
            translate(-115px, -45px)
            rotate(180deg);
    }
}


@keyframes flower8 {

    0% {
        opacity: 0;
        transform: translate(-50%, -50%);
    }

    20% {
        opacity: 1;
    }

    100% {
        opacity: 1;
        transform:
            translate(55px, -185px)
            rotate(-180deg);
    }
}


/* =========================================
   TEXT
========================================= */

.open-text {
    position: absolute;

    bottom: 48px;

    width: 100%;

    text-align: center;

    color: #ffffff;

    font-size: 20px;
    font-weight: bold;

    letter-spacing: 1px;

    cursor: pointer;

    z-index: 10;

    animation: blink 1.2s infinite steps(2);
}


/* =========================================
   TEXT BLINK
========================================= */

@keyframes blink {

    0% {
        opacity: 1;
    }

    50% {
        opacity: 0.45;
    }

    100% {
        opacity: 1;
    }

}


/* =========================================
   MESSAGE
========================================= */

.message {
    position: absolute;

    left: 0;
    right: 0;

    bottom: 5px;

    text-align: center;

    color: #ff9fc2;

    font-size: 17px;
    font-weight: bold;

    line-height: 1.6;

    letter-spacing: 1px;

    opacity: 0;

    transform:
        translateY(12px)
        scale(0.8);

    pointer-events: none;

    z-index: 20;
}


/* message appears after flowers */

.gift.open ~ .message {
    animation:
        messageAppear
        0.8s
        steps(6)
        forwards;

    animation-delay: 1.65s;
}


@keyframes messageAppear {

    0% {
        opacity: 0;
        transform:
            translateY(12px)
            scale(0.8);
    }

    60% {
        opacity: 1;
        transform:
            translateY(-3px)
            scale(1.05);
    }

    100% {
        opacity: 1;
        transform:
            translateY(0)
            scale(1);
    }

}


/* =========================================
   MOBILE
========================================= */

@media (max-width: 400px) {

    .container {
        transform: scale(0.9);
    }

}

</style>
</head>


<body>


<div class="container">


    <!-- =====================================
         GIFT
    ====================================== -->

    <div class="gift" id="gift">

        <div class="bow-left"></div>
        <div class="bow-right"></div>

        <div class="lid"></div>

        <div class="box"></div>

    </div>


    <!-- =====================================
         FLOWERS
    ====================================== -->

    <div class="flowers">

        <div class="flower flower1"></div>
        <div class="flower flower2"></div>
        <div class="flower flower3"></div>
        <div class="flower flower4"></div>

        <div class="flower flower5"></div>
        <div class="flower flower6"></div>
        <div class="flower flower7"></div>
        <div class="flower flower8"></div>

    </div>


    <!-- =====================================
         MESSAGE
    ====================================== -->

    <div class="message" id="message">

        Happy You and Me Day 💕

        <br>

        Luv U ♡

    </div>


    <!-- =====================================
         OPEN TEXT
    ====================================== -->

    <div class="open-text" id="openText">

        Psst... ♡

    </div>


</div>


<script>

/* =========================================
   ELEMENTS
========================================= */

const gift = document.getElementById("gift");
const openText = document.getElementById("openText");


/* =========================================
   OPEN GIFT
========================================= */

function openGift() {

    gift.classList.toggle("open");

}


/* =========================================
   CLICK EVENTS
========================================= */

gift.addEventListener("click", openGift);

openText.addEventListener("click", openGift);

</script>


</body>
</html>
