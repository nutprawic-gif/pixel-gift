<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Pixel Gift</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    width: 100vw;
    height: 100vh;
    overflow: hidden;

    background: #000;

    display: flex;
    justify-content: center;
    align-items: center;

    font-family: monospace;
}

.container {
    position: relative;

    width: 300px;
    height: 400px;

    display: flex;
    justify-content: center;
    align-items: center;
}

/* =================================
   GIFT
================================= */

.gift {
    position: absolute;

    width: 160px;
    height: 150px;

    bottom: 90px;

    cursor: pointer;

    image-rendering: pixelated;

    animation: wiggle 1.2s steps(1) infinite;

    z-index: 5;
}

/* =================================
   BOX
================================= */

.box {
    position: absolute;

    left: 20px;
    top: 55px;

    width: 120px;
    height: 80px;

    background: #ff6fae;

    border-top: 6px solid #ff9bc5;
    border-left: 6px solid #ff9bc5;
    border-right: 6px solid #b8326d;
    border-bottom: 8px solid #8f2456;
}

/* Ribbon */

.box::before {
    content: "";

    position: absolute;

    left: 45px;
    top: -2px;

    width: 24px;
    height: 76px;

    background: #ffd0e3;
}

/* =================================
   LID
================================= */

.lid {
    position: absolute;

    left: 10px;
    top: 35px;

    width: 140px;
    height: 30px;

    background: #ff78b2;

    border-top: 6px solid #ffb2d2;
    border-left: 6px solid #ffb2d2;
    border-right: 6px solid #b8326d;
    border-bottom: 6px solid #8f2456;

    z-index: 5;

    transition: transform 0.4s steps(4);
}

/* Ribbon on lid */

.lid::after {
    content: "";

    position: absolute;

    left: 50px;
    top: -6px;

    width: 24px;
    height: 30px;

    background: #ffd0e3;
}

/* =================================
   BOW
================================= */

.bow-left {
    position: absolute;

    left: 40px;
    top: 8px;

    width: 40px;
    height: 28px;

    background: #ff75ae;

    border: 6px solid #b8326d;

    transform: rotate(-10deg);

    z-index: 10;

    transition: transform 0.4s steps(4);
}

.bow-right {
    position: absolute;

    right: 40px;
    top: 8px;

    width: 40px;
    height: 28px;

    background: #ff75ae;

    border: 6px solid #b8326d;

    transform: rotate(10deg);

    z-index: 10;

    transition: transform 0.4s steps(4);
}

.bow-center {
    position: absolute;

    left: 68px;
    top: 14px;

    width: 24px;
    height: 24px;

    background: #ff4f98;

    border: 5px solid #b8326d;

    z-index: 20;

    transition: transform 0.4s steps(4);
}

/* =================================
   SHADOW
================================= */

.shadow {
    position: absolute;

    left: 25px;
    bottom: 0;

    width: 110px;
    height: 10px;

    background: #3a1230;

    box-shadow:
        10px 5px #18000f;
}

/* =================================
   OPEN TEXT
================================= */

.open-text {
    position: absolute;

    bottom: 35px;

    color: white;

    font-size: 24px;
    font-weight: bold;

    letter-spacing: 2px;

    cursor: pointer;

    text-shadow:
        3px 0 #ff5fa5,
        0 3px #ff5fa5;

    animation: textBlink 1.2s steps(2) infinite;

    z-index: 20;
}

/* =================================
   FLOWERS
================================= */

.flowers {
    position: absolute;

    width: 180px;
    height: 190px;

    bottom: 165px;

    left: 60px;

    pointer-events: none;

    z-index: 3;
}

/* Flower */

.flower {
    position: absolute;

    width: 30px;
    height: 30px;

    opacity: 0;
}

/* Flower center */

.flower::after {
    content: "";

    position: absolute;

    left: 10px;
    top: 10px;

    width: 10px;
    height: 10px;

    background: #ffd85c;

    z-index: 5;
}

/* Petals */

.flower span {
    position: absolute;

    width: 12px;
    height: 12px;

    background: #ff8fbd;
}

/* top */

.flower span:nth-child(1) {
    left: 9px;
    top: 0;
}

/* right */

.flower span:nth-child(2) {
    right: 0;
    top: 9px;
}

/* bottom */

.flower span:nth-child(3) {
    left: 9px;
    bottom: 0;
}

/* left */

.flower span:nth-child(4) {
    left: 0;
    top: 9px;
}

/* Different flowers */

.flower.pink span {
    background: #ff8fbd;
}

.flower.yellow span {
    background: #ffd45c;
}

.flower.purple span {
    background: #c994ff;
}

.flower.white span {
    background: #ffffff;
}

/* =================================
   FLOWER POSITIONS
================================= */

.flower1 {
    left: 70px;
    bottom: 0;
}

.flower2 {
    left: 35px;
    bottom: 5px;
}

.flower3 {
    left: 105px;
    bottom: 3px;
}

.flower4 {
    left: 55px;
    bottom: 25px;
}

/* =================================
   OPEN ANIMATION
================================= */

.gift.open .lid {
    transform: translateY(-45px) rotate(-4deg);
}

.gift.open .bow-left {
    transform: translate(-25px, -40px) rotate(-20deg);
}

.gift.open .bow-right {
    transform: translate(25px, -40px) rotate(20deg);
}

.gift.open .bow-center {
    transform: translateY(-40px);
}

/* =================================
   FLOWER BURST
================================= */

.gift.open ~ .flowers .flower {
    opacity: 1;
    animation-duration: 1.2s;
    animation-timing-function: steps(8);
    animation-fill-mode: forwards;
}

/* ดอกที่ 1 - พุ่งขึ้นซ้าย */

.gift.open ~ .flowers .flower1 {
    animation-name: burst1;
}

/* ดอกที่ 2 - พุ่งซ้าย */

.gift.open ~ .flowers .flower2 {
    animation-name: burst2;
    animation-delay: 0.08s;
}

/* ดอกที่ 3 - พุ่งขวา */

.gift.open ~ .flowers .flower3 {
    animation-name: burst3;
    animation-delay: 0.15s;
}

/* ดอกที่ 4 - พุ่งขึ้นขวา */

.gift.open ~ .flowers .flower4 {
    animation-name: burst4;
    animation-delay: 0.2s;
}


/* =================================
   BURST 1
================================= */

@keyframes burst1 {

    0% {
        opacity: 0;
        transform:
            translate(0, 60px)
            scale(0)
            rotate(0deg);
    }

    30% {
        opacity: 1;
        transform:
            translate(-15px, -30px)
            scale(1.2)
            rotate(-20deg);
    }

    60% {
        transform:
            translate(-65px, -105px)
            scale(1)
            rotate(-45deg);
    }

    80% {
        transform:
            translate(-85px, -85px)
            scale(1.1)
            rotate(-25deg);
    }

    100% {
        opacity: 1;
        transform:
            translate(-75px, -95px)
            scale(1)
            rotate(-35deg);
    }
}


/* =================================
   BURST 2
================================= */

@keyframes burst2 {

    0% {
        opacity: 0;
        transform:
            translate(0, 60px)
            scale(0)
            rotate(0deg);
    }

    30% {
        opacity: 1;
        transform:
            translate(-25px, -10px)
            scale(1.2)
            rotate(20deg);
    }

    60% {
        transform:
            translate(-110px, -30px)
            scale(1)
            rotate(55deg);
    }

    80% {
        transform:
            translate(-125px, -10px)
            scale(1.1)
            rotate(35deg);
    }

    100% {
        opacity: 1;
        transform:
            translate(-120px, -20px)
            scale(1)
            rotate(45deg);
    }
}


/* =================================
   BURST 3
================================= */

@keyframes burst3 {

    0% {
        opacity: 0;
        transform:
            translate(0, 60px)
            scale(0)
            rotate(0deg);
    }

    30% {
        opacity: 1;
        transform:
            translate(20px, -20px)
            scale(1.2)
            rotate(-20deg);
    }

    60% {
        transform:
            translate(100px, -45px)
            scale(1)
            rotate(40deg);
    }

    80% {
        transform:
            translate(125px, -20px)
            scale(1.1)
            rotate(20deg);
    }

    100% {
        opacity: 1;
        transform:
            translate(115px, -30px)
            scale(1)
            rotate(35deg);
    }
}


/* =================================
   BURST 4
================================= */

@keyframes burst4 {

    0% {
        opacity: 0;
        transform:
            translate(0, 60px)
            scale(0)
            rotate(0deg);
    }

    30% {
        opacity: 1;
        transform:
            translate(15px, -40px)
            scale(1.2)
            rotate(20deg);
    }

    60% {
        transform:
            translate(65px, -115px)
            scale(1)
            rotate(50deg);
    }

    80% {
        transform:
            translate(90px, -90px)
            scale(1.1)
            rotate(30deg);
    }

    100% {
        opacity: 1;
        transform:
            translate(80px, -100px)
            scale(1)
            rotate(45deg);
    }
}

/* =================================
   WIGGLE
================================= */

@keyframes wiggle {

    0% {
        transform: translateX(0);
    }

    25% {
        transform: translateX(-3px);
    }

    50% {
        transform: translateX(3px);
    }

    75% {
        transform: translateX(-2px);
    }

    100% {
        transform: translateX(0);
    }
}

/* =================================
   TEXT
================================= */

@keyframes textBlink {

    0%, 100% {
        opacity: 0.65;
    }

    50% {
        opacity: 1;
    }
}

</style>
</head>


<body>

<div class="container">

    <!-- =========================
         GIFT
    ========================== -->

    <div class="gift" id="gift">

        <div class="bow-left"></div>
        <div class="bow-right"></div>
        <div class="bow-center"></div>

        <div class="lid"></div>

        <div class="box"></div>

        <div class="shadow"></div>

    </div>


    <!-- =========================
         FLOWERS
    ========================== -->

    <div class="flowers">

        <div class="flower flower1 pink">
            <span></span>
            <span></span>
            <span></span>
            <span></span>
        </div>

        <div class="flower flower2 yellow">
            <span></span>
            <span></span>
            <span></span>
            <span></span>
        </div>

        <div class="flower flower3 purple">
            <span></span>
            <span></span>
            <span></span>
            <span></span>
        </div>

        <div class="flower flower4 white">
            <span></span>
            <span></span>
            <span></span>
            <span></span>
        </div>

    </div>


    <!-- =========================
         OPEN
    ========================== -->

    <div class="open-text" id="openText">
        Open!
    </div>

</div>


<script>

const gift = document.getElementById("gift");
const openText = document.getElementById("openText");

function openGift() {

    gift.classList.toggle("open");

}

gift.addEventListener("click", openGift);

openText.addEventListener("click", openGift);

</script>

</body>
</html>
```
