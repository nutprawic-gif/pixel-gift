<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>For You ♡</title>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
}

body {
    background: #000;
    overflow: hidden;

    display: flex;
    justify-content: center;
    align-items: center;

    font-family: "Courier New", monospace;
}


/* =========================================
   CONTAINER
========================================= */

.container {
    position: relative;

    width: 360px;
    height: 500px;

    display: flex;
    justify-content: center;
    align-items: center;
}


/* =========================================
   GIFT
========================================= */

.gift {
    position: absolute;

    width: 125px;
    height: 120px;

    bottom: 95px;

    cursor: pointer;

    z-index: 5;

    animation: wiggle 2s infinite steps(2);
}


/* =========================================
   BOX
========================================= */

.box {
    position: absolute;

    width: 125px;
    height: 85px;

    left: 0;
    bottom: 0;

    background: #ff5c9a;

    border: 5px solid #ff9fc2;
}


/* vertical ribbon */

.box::before {
    content: "";

    position: absolute;

    width: 18px;
    height: 80px;

    left: 48px;
    top: 0;

    background: #ffd166;
}


/* horizontal ribbon */

.box::after {
    content: "";

    position: absolute;

    width: 115px;
    height: 18px;

    left: 0;
    top: 30px;

    background: #ffd166;
}


/* =========================================
   LID
========================================= */

.lid {
    position: absolute;

    width: 135px;
    height: 32px;

    left: -5px;
    top: 10px;

    background: #ff72aa;

    border: 5px solid #ffb0ce;

    z-index: 3;

    transform-origin: left bottom;

    transition:
        transform 0.7s steps(8);
}


/* ribbon on lid */

.lid::after {
    content: "";

    position: absolute;

    width: 18px;
    height: 27px;

    left: 54px;
    top: 0;

    background: #ffd166;
}


/* =========================================
   BOW
========================================= */

.bow-left,
.bow-right {
    position: absolute;

    width: 30px;
    height: 25px;

    top: -12px;

    background: #ffd166;

    border: 4px solid #fff0a6;

    z-index: 4;

    transition:
        transform 0.7s steps(8);
}

.bow-left {
    left: 30px;

    transform: rotate(-20deg);
}

.bow-right {
    right: 30px;

    transform: rotate(20deg);
}


/* =========================================
   OPEN GIFT
========================================= */

.gift.open .lid {
    transform:
        translate(-4px, -42px)
        rotate(-5deg);
}

.gift.open .bow-left {
    transform:
        translate(-12px, -18px)
        rotate(-35deg);
}

.gift.open .bow-right {
    transform:
        translate(12px, -18px)
        rotate(35deg);
}


/* =========================================
   WIGGLE
========================================= */

@keyframes wiggle {

    0% {
        transform: rotate(0deg);
    }

    25% {
        transform: rotate(-2deg);
    }

    50% {
        transform: rotate(2deg);
    }

    75% {
        transform: rotate(-1deg);
    }

    100% {
        transform: rotate(0deg);
    }

}


/* =========================================
   FLOWERS
========================================= */

.flowers {
    position: absolute;

    width: 360px;
    height: 220px;

    left: 0;
    bottom: 210px;

    pointer-events: none;

    z-index: 7;
}


.flower {
    position: absolute;

    left: 50%;
    top: 80%;

    width: 18px;
    height: 18px;

    opacity: 0;

    transform: translate(-50%, -50%);

    image-rendering: pixelated;
}


/* petals */

.flower::before {
    content: "";

    position: absolute;

    width: 8px;
    height: 8px;

    left: 5px;
    top: 5px;

    background: currentColor;

    box-shadow:
        -7px 0 currentColor,
        7px 0 currentColor,
        0 -7px currentColor,
        0 7px currentColor;
}


/* center */

.flower::after {
    content: "";

    position: absolute;

    width: 6px;
    height: 6px;

    left: 6px;
    top: 6px;

    background: #ffd166;
}


/* colors */

.flower1 {
    color: #ff6fae;
}

.flower2 {
    color: #ffd84d;
}

.flower3 {
    color: #b58cff;
}

.flower4 {
    color: #ffffff;
}

.flower5 {
    color: #ff8fc7;
}

.flower6 {
    color: #ffe36e;
}

.flower7 {
    color: #c39bff;
}

.flower8 {
    color: #7fdcff;
}


/* =========================================
   FLOWER ANIMATIONS
   Flowers gather on the lid
========================================= */

.gift.open ~ .flowers .flower {
    animation-duration: 1.5s;

    animation-fill-mode: forwards;

    animation-timing-function: steps(12);
}


/* left */

.gift.open ~ .flowers .flower1 {
    animation-name: flower1;
    animation-delay: 0s;
}

@keyframes flower1 {

    0% {
        opacity: 0;
        transform: translate(-50%, -50%) scale(0.5);
    }

    20% {
        opacity: 1;
    }

    65% {
        transform:
            translate(-85px, -110px)
            scale(1);
    }

    100% {
        opacity: 1;
        transform:
            translate(-65px, -93px)
            scale(1);
    }
}


/* left-middle */

.gift.open ~ .flowers .flower2 {
    animation-name: flower2;
    animation-delay: 0.05s;
}

@keyframes flower2 {

    0% {
        opacity: 0;
        transform: translate(-50%, -50%) scale(0.5);
    }

    20% {
        opacity: 1;
    }

    65% {
        transform:
            translate(-55px, -145px)
            scale(1);
    }

    100% {
        opacity: 1;
        transform:
            translate(-42px, -100px)
            scale(1);
    }
}


/* center */

.gift.open ~ .flowers .flower3 {
    animation-name: flower3;
    animation-delay: 0.1s;
}

@keyframes flower3 {

    0% {
        opacity: 0;
        transform: translate(-50%, -50%) scale(0.5);
    }

    20% {
        opacity: 1;
    }

    65% {
        transform:
            translate(-5px, -160px)
            scale(1);
    }

    100% {
        opacity: 1;
        transform:
            translate(-15px, -110px)
            scale(1);
    }
}


/* right-middle */

.gift.open ~ .flowers .flower4 {
    animation-name: flower4;
    animation-delay: 0.15s;
}

@keyframes flower4 {

    0% {
        opacity: 0;
        transform: translate(-50%, -50%) scale(0.5);
    }

    20% {
        opacity: 1;
    }

    65% {
        transform:
            translate(55px, -145px)
            scale(1);
    }

    100% {
        opacity: 1;
        transform:
            translate(32px, -100px)
            scale(1);
    }
}


/* right */

.gift.open ~ .flowers .flower5 {
    animation-name: flower5;
    animation-delay: 0.2s;
}

@keyframes flower5 {

    0% {
        opacity: 0;
        transform: translate(-50%, -50%) scale(0.5);
    }

    20% {
        opacity: 1;
    }

    65% {
        transform:
            translate(90px, -110px)
            scale(1);
    }

    100% {
        opacity: 1;
        transform:
            translate(58px, -93px)
            scale(1);
    }
}


/* front-left */

.gift.open ~ .flowers .flower6 {
    animation-name: flower6;
    animation-delay: 0.25s;
}

@keyframes flower6 {

    0% {
        opacity: 0;
        transform: translate(-50%, -50%) scale(0.5);
    }

    20% {
        opacity: 1;
    }

    65% {
        transform:
            translate(-70px, -90px)
            scale(1);
    }

    100% {
        opacity: 1;
        transform:
            translate(-28px, -78px)
            scale(1);
    }
}


/* front-right */

.gift.open ~ .flowers .flower7 {
    animation-name: flower7;
    animation-delay: 0.3s;
}

@keyframes flower7 {

    0% {
        opacity: 0;
        transform: translate(-50%, -50%) scale(0.5);
    }

    20% {
        opacity: 1;
    }

    65% {
        transform:
            translate(70px, -90px)
            scale(1);
    }

    100% {
        opacity: 1;
        transform:
            translate(25px, -78px)
            scale(1);
    }
}


/* center-top */

.gift.open ~ .flowers .flower8 {
    animation-name: flower8;
    animation-delay: 0.35s;
}

@keyframes flower8 {

    0% {
        opacity: 0;
        transform: translate(-50%, -50%) scale(0.5);
    }

    20% {
        opacity: 1;
    }

    65% {
        transform:
            translate(15px, -165px)
            scale(1);
    }

    100% {
        opacity: 1;
        transform:
            translate(15px, -108px)
            scale(1);
    }
}


/* =========================================
   MESSAGE
========================================= */

.message {
    position: absolute;

    left: 0;
    right: 0;

    bottom: 280px;

    text-align: center;

    color: #ff9fc2;

    font-size: 17px;
    font-weight: bold;

    line-height: 1.6;

    letter-spacing: 1px;

    opacity: 0;

    transform:
        translateY(12px)
        scale(0.8);

    pointer-events: none;

    z-index: 10;
}


/* message appears after flowers */

.gift.open ~ .message {
    animation:
        messageAppear
        0.8s
        steps(6)
        forwards;

    animation-delay: 1.7s;
}


@keyframes messageAppear {

    0% {
        opacity: 0;

        transform:
            translateY(12px)
            scale(0.8);
    }

    60% {
        opacity: 1;

        transform:
            translateY(-3px)
            scale(1.05);
    }

    100% {
        opacity: 1;

        transform:
            translateY(0)
            scale(1);
    }
}


/* =========================================
   PSST
========================================= */

.open-text {
    position: absolute;

    bottom: 48px;

    width: 100%;

    text-align: center;

    color: #ffffff;

    font-size: 20px;
    font-weight: bold;

    letter-spacing: 1px;

    cursor: pointer;

    z-index: 10;

    animation:
        blink
        1.2s
        infinite
        steps(2);
}


@keyframes blink {

    0% {
        opacity: 1;
    }

    50% {
        opacity: 0.45;
    }

    100% {
        opacity: 1;
    }
}


/* =========================================
   MOBILE
========================================= */

@media (max-width: 400px) {

    .container {
        transform: scale(0.9);
    }

}

</style>
</head>

<div class="container">


    <!-- GIFT -->

    <div class="gift" id="gift">

        <div class="bow-left"></div>

<script>

const gift = document.getElementById("gift");
const openText = document.getElementById("openText");


function openGift() {

    gift.classList.toggle("open");

}


gift.addEventListener("click", openGift);

openText.addEventListener("click", openGift);
