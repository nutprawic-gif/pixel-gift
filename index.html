<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<title>For You ♡</title>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
}

body {
    background: #000;
    overflow: hidden;

    display: flex;
    justify-content: center;
    align-items: center;

    font-family: "Courier New", monospace;
}


/* =========================================
   MAIN CONTAINER
========================================= */

.container {
    position: relative;

    width: 360px;
    height: 500px;

    display: flex;
    justify-content: center;
    align-items: center;
}


/* =========================================
   GIFT
========================================= */

.gift {
    position: absolute;

    width: 125px;
    height: 120px;

    bottom: 95px;

    cursor: pointer;

    z-index: 5;

    animation: wiggle 2s infinite steps(2);
}


/* กล่อง */

.box {
    position: absolute;

    width: 125px;
    height: 85px;

    left: 0;
    bottom: 0;

    background: #ff5c9a;

    border: 5px solid #ff9fc2;
}


/* ริบบิ้นแนวตั้ง */

.box::before {
    content: "";

    position: absolute;

    width: 18px;
    height: 80px;

    left: 48px;
    top: 0;

    background: #ffd166;
}


/* ริบบิ้นแนวนอน */

.box::after {
    content: "";

    position: absolute;

    width: 115px;
    height: 18px;

    left: 0;
    top: 30px;

    background: #ffd166;
}


/* =========================================
   LID
========================================= */

.lid {
    position: absolute;

    width: 135px;
    height: 32px;

    left: -5px;
    top: 10px;

    background: #ff72aa;

    border: 5px solid #ffb0ce;

    z-index: 3;

    transform-origin: left bottom;

    transition:
        transform 0.7s steps(8);
}


/* ริบบิ้นบนฝากล่อง */

.lid::after {
    content: "";

    position: absolute;

    width: 18px;
    height: 27px;

    left: 54px;
    top: 0;

    background: #ffd166;
}


/* =========================================
   BOW
========================================= */

.bow-left,
.bow-right {
    position: absolute;

    width: 30px;
    height: 25px;

    top: -12px;

    background: #ffd166;

    border: 4px solid #fff0a6;

    z-index: 4;

    transition:
        transform 0.7s steps(8);
}


.bow-left {
    left: 30px;

    transform: rotate(-20deg);
}


.bow-right {
    right: 30px;

    transform: rotate(20deg);
}


/* =========================================
   OPEN GIFT
========================================= */

.gift.open .lid {
    transform:
        translate(-4px, -42px)
        rotate(-5deg);
}


.gift.open .bow-left {
    transform:
        translate(-12px, -18px)
        rotate(-35deg);
}


.gift.open .bow-right {
    transform:
        translate(12px, -18px)
        rotate(35deg);
}


/* =========================================
   GIFT WIGGLE
========================================= */

@keyframes wiggle {

    0% {
        transform: rotate(0deg);
    }

    25% {
        transform: rotate(-2deg);
    }

    50% {
        transform: rotate(2deg);
    }

    75% {
        transform: rotate(-1deg);
    }

    100% {
        transform: rotate(0deg);
    }
}


/* =========================================
   FLOWERS
========================================= */

.flowers {
    position: absolute;

    width: 360px;
    height: 220px;

    left: 0;
    bottom: 210px;

    pointer-events: none;

    z-index: 7;
}


.flower {
    position: absolute;

    left: 50%;
    top: 80%;

    width: 18px;
    height: 18px;

    opacity: 0;

    transform:
        translate(-50%, -50%);

    image-rendering: pixelated;
}


/* กลีบดอก */

.flower::before {
    content: "";

    position: absolute;

    width: 8px;
    height: 8px;

    left: 5px;
    top: 5px;

    background: currentColor;

    box-shadow:
        -7px 0 currentColor,
        7px 0 currentColor,
        0 -7px currentColor,
        0 7px currentColor;
}


/* เกสร */

.flower::after {
    content: "";

    position: absolute;

    width: 6px;
    height: 6px;

    left: 6px;
    top: 6px;

    background: #ffd166;
}


/* =========================================
   FLOWER COLORS
========================================= */

.flower1 {
    color: #ff6fae;
}

.flower2 {
    color: #ffd84d;
}

.flower3 {
    color: #b58cff;
}

.flower4 {
    color: #ffffff;
}

.flower5 {
    color: #ff8fc7;
}

.flower6 {
    color: #ffe36e;
}

.flower7 {
    color: #c39bff;
}

.flower8 {
    color: #7fdcff;
}


/* =========================================
   FLOWER ANIMATION
========================================= */

.gift.open ~ .flowers .flower {

    animation-duration: 1.5s;

    animation-fill-mode: forwards;

    animation-timing-function: steps(12);
}


/* ดอกที่ 1 */

.gift.open ~ .flowers .flower1 {
    animation-name: flower1;
    animation-delay: 0s;
}


/* ดอกที่ 2 */

.gift.open ~ .flowers .flower2 {
    animation-name: flower2;
    animation-delay: 0.05s;
}


/* ดอกที่ 3 */

.gift.open ~ .flowers .flower3 {
    animation-name: flower3;
    animation-delay: 0.1s;
}


/* ดอกที่ 4 */

.gift.open ~ .flowers .flower4 {
    animation-name: flower4;
    animation-delay: 0.15s;
}


/* ดอกที่ 5 */

.gift.open ~ .flowers .flower5 {
    animation-name: flower5;
    animation-delay: 0.2s;
}


/* ดอกที่ 6 */

.gift.open ~ .flowers .flower6 {
    animation-name: flower6;
    animation-delay: 0.25s;
}


/* ดอกที่ 7 */

.gift.open ~ .flowers .flower7 {
    animation-name: flower7;
    animation-delay: 0.3s;
}


/* ดอกที่ 8 */

.gift.open ~ .flowers .flower8 {
    animation-name: flower8;
    animation-delay: 0.35s;
}


/* =========================================

@keyframes flower1 {

    0% {
        opacity: 0;

        transform:
            translate(-50%, -50%)
            scale(0.5);
    }

        opacity: 1;
    }

/* แสดงข้อความหลังดอกไม้ */
