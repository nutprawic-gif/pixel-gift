<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Pixel Gift</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    width: 100vw;
    height: 100vh;
    overflow: hidden;

    background: #000;

    display: flex;
    justify-content: center;
    align-items: center;

    font-family: monospace;
}


/* =========================================
   CONTAINER
========================================= */

.container {
    position: relative;

    width: 360px;
    height: 500px;

    display: flex;
    justify-content: center;
    align-items: center;
}


/* =========================================
   GIFT
========================================= */

.gift {
    position: absolute;

    width: 160px;
    height: 150px;

    bottom: 95px;

    cursor: pointer;

    image-rendering: pixelated;

    animation: wiggle 1.2s steps(1) infinite;

    z-index: 10;
}


/* =========================================
   BOX
========================================= */

.box {
    position: absolute;

    left: 20px;
    top: 55px;

    width: 120px;
    height: 80px;

    background: #ff6fae;

    border-top: 6px solid #ff9bc5;
    border-left: 6px solid #ff9bc5;
    border-right: 6px solid #b8326d;
    border-bottom: 8px solid #8f2456;
}


/* Vertical ribbon */

.box::before {
    content: "";

    position: absolute;

    left: 45px;
    top: -2px;

    width: 24px;
    height: 76px;

    background: #ffd0e3;
}


/* =========================================
   LID
========================================= */

.lid {
    position: absolute;

    left: 10px;
    top: 35px;

    width: 140px;
    height: 30px;

    background: #ff78b2;

    border-top: 6px solid #ffb2d2;
    border-left: 6px solid #ffb2d2;
    border-right: 6px solid #b8326d;
    border-bottom: 6px solid #8f2456;

    z-index: 5;

    transition:
        transform 0.45s steps(5);
}


/* Ribbon on lid */

.lid::after {
    content: "";

    position: absolute;

    left: 50px;
    top: -6px;

    width: 24px;
    height: 30px;

    background: #ffd0e3;
}


/* =========================================
   BOW
========================================= */

.bow-left {
    position: absolute;

    left: 40px;
    top: 8px;

    width: 40px;
    height: 28px;

    background: #ff75ae;

    border: 6px solid #b8326d;

    transform: rotate(-10deg);

    z-index: 10;

    transition:
        transform 0.45s steps(5);
}


.bow-right {
    position: absolute;

    right: 40px;
    top: 8px;

    width: 40px;
    height: 28px;

    background: #ff75ae;

    border: 6px solid #b8326d;

    transform: rotate(10deg);

    z-index: 10;

    transition:
        transform 0.45s steps(5);
}


.bow-center {
    position: absolute;

    left: 68px;
    top: 14px;

    width: 24px;
    height: 24px;

    background: #ff4f98;

    border: 5px solid #b8326d;

    z-index: 20;

    transition:
        transform 0.45s steps(5);
}


/* =========================================
   SHADOW
========================================= */

.shadow {
    position: absolute;

    left: 25px;
    bottom: 0;

    width: 110px;
    height: 10px;

    background: #3a1230;

    box-shadow:
        10px 5px #18000f;
}


/* =========================================
   OPEN TEXT
========================================= */

.open-text {
    position: absolute;

    bottom: 40px;

    color: white;

    font-size: 24px;
    font-weight: bold;

    letter-spacing: 2px;

    cursor: pointer;

    text-shadow:
        3px 0 #ff5fa5,
        0 3px #ff5fa5;

    animation:
        textBlink 1.2s steps(2) infinite;

    z-index: 30;
}


/* =========================================
   FLOWERS AREA
========================================= */

.flowers {
    position: absolute;

    width: 360px;
    height: 300px;

    left: 0;
    bottom: 180px;

    pointer-events: none;

    z-index: 4;
}


/* =========================================
   FLOWER
========================================= */

.flower {
    position: absolute;

    width: 30px;
    height: 30px;

    left: 165px;
    bottom: 0;

    opacity: 0;

    image-rendering: pixelated;
}


/* =========================================
   FLOWER CENTER
========================================= */

.flower::after {
    content: "";

    position: absolute;

    left: 9px;
    top: 9px;

    width: 12px;
    height: 12px;

    background: #ffd85c;

    z-index: 5;
}


/* =========================================
   PETALS
========================================= */

.flower span {
    position: absolute;

    width: 12px;
    height: 12px;
}


/* Top */

.flower span:nth-child(1) {
    left: 9px;
    top: 0;
}


/* Right */

.flower span:nth-child(2) {
    right: 0;
    top: 9px;
}


/* Bottom */

.flower span:nth-child(3) {
    left: 9px;
    bottom: 0;
}


/* Left */

.flower span:nth-child(4) {
    left: 0;
    top: 9px;
}


/* =========================================
   FLOWER COLORS
========================================= */

.flower.pink span {
    background: #ff8fbd;
}

.flower.yellow span {
    background: #ffd45c;
}

.flower.purple span {
    background: #c994ff;
}

.flower.white span {
    background: #ffffff;
}

.flower.blue span {
    background: #75cfff;
}


/* =========================================

========================================= */

/* =========================================
   OPEN GIFT
========================================= */

.gift.open .lid {
    transform:
        translate(-5px, -55px)
        rotate(-5deg);
}


.gift.open .bow-left {
    transform:
        translate(-30px, -50px)

}


.gift.open .bow-right {
    transform:
        translate(30px, -50px)

}


.gift.open .bow-center {
    transform:
        translateY(-50px);
}


/* =========================================
   FLOWER BURST
========================================= */

.gift.open ~ .flowers .flower {

    animation-duration: 1.4s;

    animation-timing-function: steps(10);

    animation-fill-mode: forwards;
}


/* =========================================

.gift.open ~ .flowers .flower1 {

}

.gift.open ~ .flowers .flower2 {

.gift.open ~ .flowers .flower3 {
